<section id="map" class="map-section">
  <div class="section-shell">
    <div appReveal class="map-card">
      <div class="map-copy">
        <p class="section-kicker">PROJECT LOCATION</p>
        <h2 class="map-title">{{ content.map.title }}</h2>
        <p class="map-description">
          Nature Green at Bavdhan, Pune offers peaceful surroundings with excellent connectivity to Chandani Chowk, Mumbai–Bengaluru Highway, schools, hospitals, shopping hubs, and daily essentials.
        </p>
        <div class="map-address-card">
          <span class="map-address-icon">
            <lucide-icon name="MapPin" size="22"></lucide-icon>
          </span>
          <div>
            <p class="map-address-title">{{ content.brand.projectName }}</p>
            <p class="map-address-text">{{ content.brand.location }}</p>
          </div>
        </div>
      </div>

      <iframe
        class="map-frame"
        title="Nature Green location map"
        [src]="mapUrl"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</section>
