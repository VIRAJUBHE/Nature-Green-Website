<div class="preview-backdrop" role="presentation" (click)="close()">
<div class="preview-dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
  <div class="preview-toolbar">
    <div class="preview-caption">
      <p class="preview-title">{{ data().title }}</p>
      @if (data().description) {
        <p class="preview-description">{{ data().description }}</p>
      }
    </div>

    <div class="preview-actions">
      @if (data().mediaType !== 'video') {
        <button class="dialog-icon-btn" type="button" aria-label="Zoom out" (click)="zoomOut()">
          <lucide-icon name="ZoomOut" size="18"></lucide-icon>
        </button>
        <button class="dialog-icon-btn" type="button" aria-label="Zoom in" (click)="zoomIn()">
          <lucide-icon name="ZoomIn" size="18"></lucide-icon>
        </button>
      }
      <button class="dialog-icon-btn" type="button" aria-label="Close preview" (click)="close()">
        <lucide-icon name="X" size="18"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="preview-stage">
    @if (data().mediaType === 'video') {
      <video
        class="preview-image preview-video"
        [src]="data().src"
        [attr.aria-label]="data().alt"
        controls
        autoplay
        playsinline
      ></video>
    } @else {
      <img
        class="preview-image"
        [src]="data().src"
        [alt]="data().alt"
        [style.transform]="'scale(' + zoom() + ')'"
        loading="eager"
        decoding="async"
      />
    }
  </div>
</div>
</div>
